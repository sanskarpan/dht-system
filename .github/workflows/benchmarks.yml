name: Benchmarks

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  simulation-benchmarks:
    name: Simulation benchmark suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dht-system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: dht-system/go.mod
          cache: true
          cache-dependency-path: dht-system/go.sum

      - name: Run benchmark-oriented simulation tests
        run: go test ./internal/simulation -run 'TestBenchmark|TestRingStabilizesWithin3s|TestKeyMigrationSpeed' -count=1
